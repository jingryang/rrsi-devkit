operator:
  name: Abs
  category: Elementwise
  difficulty: L1
  formula: y = |x|
  description: 逐元素计算输入张量的绝对值
  shape_support: 输入 0-8 维，输出与输入相同 shape
  attrs: []
  inputs:
  - name: x
    description: 输入张量
    dtype:
    - float16
    - float32
    - bfloat16
    - int8
    - int32
    - int64
  outputs:
  - name: y
    description: 输出张量，输入的逐元素绝对值，dtype 与输入一致
    dtype:
    - float16
    - float32
    - bfloat16
    - int8
    - int32
    - int64
  schema: abs(Tensor x) -> Tensor y
