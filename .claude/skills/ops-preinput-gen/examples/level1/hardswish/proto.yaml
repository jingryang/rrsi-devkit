operator:
  name: HardSwish
  category: Elementwise
  difficulty: L1
  formula: y = x * ReLU6(x + 3) / 6
  description: HardSwish 激活函数，Swish 的分段线性近似，移动端友好
  shape_support: 输入 0-8 维，输出与输入相同 shape
  attrs: []
  inputs:
  - name: x
    description: 输入张量
    dtype:
    - float16
    - float32
    - bfloat16
  outputs:
  - name: y
    description: 输出张量，HardSwish 激活结果
    dtype:
    - float16
    - float32
    - bfloat16
  schema: hardswish(Tensor x) -> Tensor y
