operator:
  name: Softsign
  category: Elementwise
  difficulty: L1
  formula: y = x / (1 + |x|)
  description: Softsign 激活函数，将输入平滑压缩到 (-1, 1) 区间
  shape_support: 输入 0-8 维，输出与输入相同 shape
  attrs: []
  inputs:
  - name: x
    description: 输入张量
    dtype:
    - float16
    - float32
    - bfloat16
  outputs:
  - name: y
    description: 输出张量，Softsign 激活结果，取值落在 (-1, 1)
    dtype:
    - float16
    - float32
    - bfloat16
  schema: softsign(Tensor x) -> Tensor y
