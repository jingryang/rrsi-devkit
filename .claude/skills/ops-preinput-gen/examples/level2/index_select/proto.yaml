operator:
  name: IndexSelect
  category: IndexGather
  difficulty: L2
  formula: y[..., i, ...] = x[..., index[i], ...]  (沿 dim 维按 index 取行)
  description: 沿指定维度按索引张量取出若干切片并拼接为新张量
  shape_support: 'x: 任意 1-8 维；index: 1D，长度 L；y: 与 x 同 shape，仅 dim 维大小变为 L'
  attrs:
  - name: dim
    type: int64
    description: '沿哪一维取索引 (取值范围: -ndim ~ ndim-1)'
    required: true
  inputs:
  - name: x
    description: 被索引的输入张量
    dtype:
    - float16
    - float32
    - bfloat16
    - int32
    - int64
  - name: index
    description: 索引张量，必须为 1D，元素取值范围 [0, x.shape[dim]-1]
    dtype:
    - int32
    - int64
  outputs:
  - name: y
    description: 输出张量，与 x 同 shape，仅 dim 维大小变为 index 的长度 L
    dtype:
    - float16
    - float32
    - bfloat16
    - int32
    - int64
  schema: index_select(Tensor x, int dim, Tensor index) -> Tensor y
