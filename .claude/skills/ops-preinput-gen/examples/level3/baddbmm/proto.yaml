operator:
  name: Baddbmm
  category: Contraction
  difficulty: L3
  formula: y = beta * input + alpha * (batch1 @ batch2)
  description: 批量矩阵乘加，对 batch1 与 batch2 做批量矩阵乘后与 input 加权相加
  shape_support: 'input: [B, N, P], batch1: [B, N, M], batch2: [B, M, P], y: [B, N, P]'
  attrs:
  - name: beta
    type: float
    default: 1.0
    description: input 的缩放系数
    required: false
  - name: alpha
    type: float
    default: 1.0
    description: 批量矩阵乘结果的缩放系数
    required: false
  inputs:
  - name: input
    description: 被累加的张量，shape 为 [B, N, P]
    dtype:
    - float16
    - float32
    - bfloat16
  - name: batch1
    description: 批量矩阵乘左操作数，shape 为 [B, N, M]
    dtype:
    - float16
    - float32
    - bfloat16
  - name: batch2
    description: 批量矩阵乘右操作数，shape 为 [B, M, P]
    dtype:
    - float16
    - float32
    - bfloat16
  outputs:
  - name: y
    description: 输出张量，shape 为 [B, N, P]，dtype 与输入一致
    dtype:
    - float16
    - float32
    - bfloat16
  schema: baddbmm(Tensor input, Tensor batch1, Tensor batch2, float beta=1.0, float alpha=1.0)
    -> Tensor y
