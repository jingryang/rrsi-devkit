# Elementwise 典型范式
# 适用：Add/Sub/Mul/Div/Relu/Cast 等每元素独立算子
# 对应 vf_archetypes 模式 1/2

pattern_id: pattern_1_single_vf_v1
status: standard
version: 1
created_at: 2026-06-28

dims:
  topology: per_element
  density: O(1)
  pipeline_stages: "1"
  reuse_tier: none
  dynamicity: static

derived:
  vf_count_min: 1
  buffer_num_min: 2
  hw_path: SIMD

strategy:
  vf_count: 1
  copy_in:
    - {id: copy_in, engine: mte2, api: DataCopyPad}
  vfs:
    - vf_id: vf_0
      stages: [load(UB→Reg), compute, store(Reg→UB)]
  copy_out:
    - {id: copy_out, engine: mte3, api: DataCopyPad}
  buffer_num: 2
  double_buffer: true
  sync_points:
    - {between: [copy_in, vf_0], mechanism: "EnQue/DeQue", via: inQueue}
    - {between: [vf_0, copy_out], mechanism: "EnQue/DeQue", via: outQueue}
  ub_layout_template:
    - {name: x_buf, role: input, size_ratio: 0.5, is_resident: false}
    - {name: y_buf, role: output, size_ratio: 0.5, is_resident: false}

perf_expectation:
  bottleneck: memory-bound
  bandwidth_util: [0.85, 0.95]
  compute_util: [0.05, 0.15]

variants:
  - {condition: "small_shape (tile < 32 elements)", adjustment: {buffer_num: 1}}
  - {condition: "ub_constrained (< 16KB)", adjustment: {single_buffer: true}}

instances:
  - {operator: Add, shape: [1024, 1024], dtype: float16}
  - {operator: Relu, shape: [B, S, D], dtype: float16}
  - {operator: Cast, shape: [B, S, D], dtype: float16 -> float32}
