# 多 VF 独立范式
# 适用：多路输入各自独立变换后汇总输出的算子
# 对应 vf_archetypes 模式 5（M 路 CopyIn + N 路 VF 独立）

pattern_id: pattern_5_parallel_vf_v1
status: standard
version: 1
created_at: 2026-06-28

dims:
  topology: independent_vfs
  density: O(D)
  pipeline_stages: "2"
  reuse_tier: none
  dynamicity: static

derived:
  vf_count_min: 2
  buffer_num_min: 2
  hw_path: SIMD

strategy:
  vf_count: 2
  copy_in:
    - {id: copy_in_a, engine: mte2, api: DataCopyPad, note: "M 路并行发出，无同步"}
    - {id: copy_in_b, engine: mte2, api: DataCopyPad, note: "M 路并行发出，无同步"}
  vfs:
    - {vf_id: vf_0, role: compute_block_A, stages: [load(UB→Reg), compute, store(Reg→UB)]}
    - {vf_id: vf_1, role: compute_block_B, stages: [load(UB→Reg), compute, store(Reg→UB)]}
  vfs_independent: true  # data_flow 无 VF→VF 边，各 VF 独立，顺序无约束
  copy_out:
    - {id: copy_out, engine: mte3, api: DataCopyPad}
  buffer_num: 2
  double_buffer: true
  sync_points:
    - {between: [copy_in, vfs], mechanism: "EnQue/DeQue", via: inQueue}
    - {between: [vfs, copy_out], mechanism: "EnQue/DeQue", via: outQueue}
  # VF 间无依赖（独立），无 VF 间同步
  ub_layout_template:
    - {name: a_buf, role: input, size_ratio: 0.4, is_resident: false}
    - {name: b_buf, role: input, size_ratio: 0.4, is_resident: false}
    - {name: c_buf, role: output, size_ratio: 0.2, is_resident: false}

perf_expectation:
  bottleneck: memory-bound
  bandwidth_util: [0.70, 0.85]
  compute_util: [0.10, 0.25]

variants:
  - {condition: "small_inputs", adjustment: {vf_count: 1, rationale: "合并为单 VF"}}

instances:
  # RegBase 中模式 5 暂无成熟实例。多路输入各自独立变换的场景在 RegBase 中
  # 通常通过单 VF 或多核并行的方式实现，多 VF 独立模式留作理论完备性占位。
