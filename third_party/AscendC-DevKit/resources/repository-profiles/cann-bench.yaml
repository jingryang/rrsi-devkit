# cann-bench：算子评测基准仓。
# 算子位于 examples/aclnn_launch_example/csrc/ops/<op_name>/，
# 构建脚本 examples/aclnn_launch_example/build.sh。
# 算子无统一前缀（plain name，如 add/exp/sqrt）。
name: cann-bench
display_name: "cann-bench 评测仓"
op_naming:
  prefix: ""           # 无前缀，直接用算子短名
# 脚手架（算子调用协议）单一权威源：整仓统一用 selected 声明的协议。
# cann-bench 物理上支持 torch.ops 注册、aclnn 直调、pybind 三种，当前默认 torch_op。
# 改此单字段即全局切换（codegen 产注册代码 / smoke 探针 / 部署调用 / 胶水适配均读 selected）；
# 加载期校验 selected ∈ supported（§1.3）。
scaffolding:
  supported: [torch_op, aclnn, pybind]
  selected: torch_op
artifacts_ignore:
  - "*.o"
  - "*.so"
  - "*.a"
  - "build/"
  - "*.log"
  - "__pycache__/"
# precision_debug 的自动提交边界。路径相对单个算子目录：
# 只允许生产代码目录和根 CMakeLists.txt；调试脚本、日志、备份及编译产物
# 即使由 leaf agent 生成，也保留在工作区而不进入自动 commit。
precision_debug_commit:
  include:
    - "CMakeLists.txt"
    - "op_api/**"
    - "op_host/**"
    - "op_kernel/**"
    - "op_plugin/**"
  exclude:
    - "*.bak"
    - "**/*.bak"
    - "*.log"
    - "**/*.log"
    - "*_test.py"
    - "**/*_test.py"
    - "kernel_meta/**"
    - "**/kernel_meta/**"
    - "extra-info/**"
    - "**/extra-info/**"
    - "result_*"
    - "stderr_*"
    - "postfix_*"
    - "round*_*.log"
build_variants:
  - name: default
    match_prefix: "examples/aclnn_launch_example/csrc/ops"
    # 脚手架参考根（机制⓪/E0）：收窄为**单个干净样例算子**目录，而非整个 ops/
    # 目录。整目录会把所有兄弟算子（含 codegen 生成的、可能带毒的）暴露给 coder，
    # 是 Q10（coder 浏览 sibling 照抄错误实现）的根。收窄到一个结构完整、origin
    # 权威、纯 elementwise 的样例（add：op_api/op_host/op_kernel/op_plugin +
    # CMakeLists + infershape 全套），coder 只从它学**仓约定/脚手架**（注册宏、
    # 目录布局、build 胶水），算法读设计产物。此处点名具体样例算子属**实例配置
    # 数据**（同 golden 路径），非工程代码里的算子特判（§1.12 约束的是 Python/
    # skill 分类锚点，profile 资源清单允许具名样例）。换样例只改此单字段。
    default_reference_root: "examples/aclnn_launch_example/csrc/ops/add"
    # clean rebuild 清 CMake GLOB cache（build_py）+ build opp dir + egg-info，
    # 强制 reconfigure 让新算子进 _C.abi3.so（P96 根因：INTERNAL cache + GLOB
    # 无 CONFIGURE_DEPENDS）。cannbench_adapt 改 glue 后 Deployer.deploy(clean_build=True) 触发。
    clean_dirs: ["build_py", "build", "*.egg-info"]
    stages:
      # role: build — 编译产出 dist/*.run + dist/*.whl
      - name: ascendc
        role: build
        cwd: "examples/aclnn_launch_example"
        command_template: "bash build.sh --soc={soc_version}"
        # step-101：不做增量构建（incremental_command_template 已删）——cann-bench
        # CMake 源拷贝的 mtime 判定缺陷使 kernel 源变更不进 binary（smoke 幽灵失败
        # 死循环，20260827 批实证），全量仅 ~68s、增量仅省 ~35s。恒走全量 build.sh
        # （其内部 rm -rf build/）。机制保留在 profile 体系，真实算子仓启用增量的
        # 前提 = 该仓构建增量正确性由产权方背书（step-101 L3 冻结边界）。
        default_chip: "A2"   # 对齐本机 910B3 硬件(profile default_chip 盖过 detect,须与硬件一致,否则 build 出不可执行二进制)
        enabled: true
      # role: install_runtime — 装 opp 到 per-op 目录（{run_pkg} 由 DeployStage 定位注入）
      - name: install_opp
        role: install_runtime
        cwd: "examples/aclnn_launch_example"
        command_template: "bash {run_pkg} --quiet --install-path={per_op_opp_dir}"
        enabled: true
      # role: install_python — pip 装 whl 到 per-op python 目录
      - name: install_whl
        role: install_python
        cwd: "examples/aclnn_launch_example"
        command_template: "pip install --target {per_op_python_dir} --force-reinstall --no-deps {whl_pkg}"
        enabled: true
      # role: smoke — 空 command_template = 由 DeployStage 按 codegen_manifest.callable_target 构造校验脚本
      - name: smoke
        role: smoke
        cwd: "examples/aclnn_launch_example"
        command_template: ""
        enabled: true

# eval_prepare: 评测前一次性 build 的固定框架组件（非 per-op，不进 build_variants）。
# cann_bench_utils 是 kernel_eval perf 预热的反作弊工具算子（cann_bench_warmup/
# cann_bench_cache_clean + _C 扩展）的硬依赖；cann-bench eval 前由 CannbenchScorer
# ensure 一次（预检通过则跳过，不可达才 build+install）。step-82 决策1=C 主修复。
# --soc 写死对齐本机 950DT：build.sh 探测失败会静默降级 ascend910b（错编 kernel
# 在他代芯片上 AICore 崩 → 性能采集全灭的 50 分假基线，20261022 batch 实证）。
# 换机须改此行（同 default_chip「须与硬件一致」纪律）。
eval_prepare:
  - name: cann_bench_utils_build
    cwd: "src/cann_bench_utils"
    command_template: "bash build.sh --clean --soc=ascend950"
    role: build
    enabled: true
  - name: cann_bench_utils_install
    cwd: "src/cann_bench_utils"
    command_template: "pip install dist/cann_bench_utils-*.whl --force-reinstall --no-deps"
    role: install_python
    enabled: true

# —— golden / cases 来源已改为 CLI 显式（13 E1，B9a）——
# cann-bench 的权威 golden（tasks/level<N>/<op>/golden.py）与评测用例
#（tasks/level<N>/<op>/cases.csv）不再由 profile 声明、不做 {op}/{N} 运行期代换；
# 改由 self_evolve_op / run 在 CLI 显式传入：
#   --golden / --golden-entry(<op>) / --golden-input-type(torch) / --cann-bench-cases
# 让 ① verify 与 ② cannbench_eval 同源（同一份 golden 公式 + 同一批用例），
# 但来源是用户显式路径，而非仓级 profile 预置。
